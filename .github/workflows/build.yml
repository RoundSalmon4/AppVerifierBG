name: Build APK
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: feature/all-enhancements
        type: choice
        options:
          - feature/all-enhancements
          - fix/bugs-195-223-205
      build_type:
        description: 'Build type'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - verify

permissions:
  contents: write
  attestations: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin ${{ github.event.inputs.branch }}

      - name: Download verified-apps database
        run: curl -fsSL -o "$RUNNER_TEMP/data.yml" "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml"

      - name: Verify database attestation
        continue-on-error: true
        run: gh attestation verify --owner privacyguides "$RUNNER_TEMP/data.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up debug keystore
        if: ${{ github.event.inputs.build_type == 'debug' }}
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android 2>&1

      - name: Set up release keystore
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'verify' }}
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Set build date
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'verify' }}
        run: echo "BUILD_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'verify' }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionSuffix=-$BUILD_DATE

      - name: Save first APK for verification
        if: ${{ github.event.inputs.build_type == 'verify' }}
        run: |
          mkdir -p /tmp/verify
          cp app/build/outputs/apk/release/*.apk /tmp/verify/original.apk

      - name: Rebuild APK from same source
        if: ${{ github.event.inputs.build_type == 'verify' }}
        run: |
          rm -f app/build/outputs/apk/release/*.apk
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionSuffix=-$BUILD_DATE --rerun-tasks
          cp app/build/outputs/apk/release/*.apk /tmp/verify/rebuild.apk

      - name: Compare APKs for reproducibility
        if: ${{ github.event.inputs.build_type == 'verify' }}
        run: |
          ORIGINAL=/tmp/verify/original.apk
          REBUILT=/tmp/verify/rebuild.apk
          RESULT=$(python3 .github/scripts/compare_apks.py "$ORIGINAL" "$REBUILT")
          echo "$RESULT"
          if echo "$RESULT" | grep -q "All non-signature files match"; then
            VERDICT="✅ REPRODUCIBLE"
          else
            VERDICT="❌ NOT REPRODUCIBLE"
          fi
          echo "::notice::$VERDICT — see step summary for details"
          echo "$VERDICT"
          {
            echo "## Verify Result"
            echo ""
            echo "**Branch:** ${{ github.event.inputs.branch }}"
            echo "**Commit:** $(git rev-parse HEAD)"
            echo ""
            echo "**Original:** $(basename "$ORIGINAL") ($(stat --format=%s "$ORIGINAL") bytes)"
            echo "**Rebuilt:**  $(basename "$REBUILT") ($(stat --format=%s "$REBUILT") bytes)"
            echo ""
            echo '```'
            echo "$RESULT"
            echo '```'
            echo ""
            echo "### $VERDICT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload verify original APK
        if: ${{ github.event.inputs.build_type == 'verify' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-original
          path: /tmp/verify/original.apk

      - name: Upload verify rebuilt APK
        if: ${{ github.event.inputs.build_type == 'verify' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-rebuilt
          path: /tmp/verify/rebuild.apk
