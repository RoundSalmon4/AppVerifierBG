name: Verify Database

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Source types to check"
        required: true
        default: all
        type: choice
        options:
          - all
          - direct
          - fdroid
          - gplay
      percent:
        description: "Random sample percentage (0 = all packages)"
        required: false
        default: "5"
      packages:
        description: "Comma-separated package IDs (overrides percent)"
        required: false
        default: ""
      dry_run:
        description: "Print issue body without creating it"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  attestations: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install "protobuf<4" pyyaml googleplay-python

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install build-tools (for apksigner)
        run: |
          SDK=$ANDROID_SDK_ROOT
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" 2>&1
          echo "apksigner: $(find "$SDK/build-tools" -name apksigner -print -quit 2>/dev/null || echo 'not found')"

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          # Try main tip first (freshest data). Attestations will exist once
          # upstream resumes signing submission commits.
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Extract current database packages (for stale-entry detection)
        run: |
          cat > /tmp/extract_pkgs.py << 'PYEOF'
import os, re

def extract_balanced(text, start):
    depth = 1
    i = start
    while i < len(text):
        c = text[i]
        if c == '(':
            depth += 1
        elif c == ')':
            depth -= 1
            if depth == 0:
                return i + 1
        elif c in "'`":
            delim = c
            i += 1
            while i < len(text):
                if text[i] == '\\':
                    i += 2
                    continue
                if text[i] == delim:
                    break
                i += 1
        i += 1
    return len(text)

path = 'app/src/main/kotlin/dev/soupslurpr/appverifier/InternalVerificationInfoDatabase.kt'
with open(path) as f:
    text = f.read()

pkgs_all = []
idx = 0
marker = 'InternalDatabaseVerificationInfo('
while True:
    pos = text.find(marker, idx)
    if pos == -1:
        break
    content_start = pos + len(marker)
    entry_end = extract_balanced(text, content_start)
    entry_text = text[pos:entry_end]
    idx = entry_end

    m = re.search(r'"([^"]+)"', entry_text)
    if not m:
        continue
    pkg = m.group(1)

    has_pg = bool(re.search(r'Source\.(?!APPVERIFIER)\b', entry_text))
    pkgs_all.append((pkg, has_pg))

runner_temp = os.environ['RUNNER_TEMP']
with open(runner_temp + '/db_packages.txt', 'w') as out:
    for p, _ in sorted(pkgs_all):
        out.write(p + '\n')
with open(runner_temp + '/pg_packages.txt', 'w') as out:
    for p, has_pg in sorted(pkgs_all):
        if has_pg:
            out.write(p + '\n')
total = len(pkgs_all)
pg_count = sum(1 for _, h in pkgs_all if h)
print(f'{total} packages ({pg_count} with PG sources)')
PYEOF
          python3 /tmp/extract_pkgs.py

      - name: Download release data (for stale-entry issue lookups)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R privacyguides/verified-apps \
            -p "data.yml" --dir "$RUNNER_TEMP" --clobber \
            -O "$RUNNER_TEMP/data-release.yml" 2>/dev/null || true
          if [ ! -f "$RUNNER_TEMP/data-release.yml" ]; then
            echo "No release data available."
            touch "$RUNNER_TEMP/data-release.yml"
          fi

      - name: Run verification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_EMAIL: ${{ secrets.GOOGLE_PLAY_EMAIL }}
          GOOGLE_PLAY_AAS_TOKEN: ${{ secrets.GOOGLE_PLAY_AAS_TOKEN }}
          MODE: ${{ inputs.mode || 'all' }}
          PERCENT: ${{ inputs.percent || '5' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          args="--data-yml $RUNNER_TEMP/data.yml --mode $MODE --output $RUNNER_TEMP/report.json"
          if [ -n "$PACKAGES" ]; then
            args="$args --packages $PACKAGES"
          elif [ "$PERCENT" != "0" ]; then
            args="$args --percent $PERCENT"
          fi
          python .github/scripts/verify_database.py $args
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-report
          path: ${{ runner.temp }}/report.json

      - name: Report summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            python .github/scripts/generate_summary.py "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: File issue on mismatch
        if: always() && (github.event_name == 'schedule' || inputs.dry_run == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT_DATA: ${{ runner.temp }}/data.yml
          RELEASE_DATA: ${{ runner.temp }}/data-release.yml
          DB_PACKAGES: ${{ runner.temp }}/pg_packages.txt
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/report.json" ]; then
            echo "No report found, skipping."
            exit 0
          fi
          cat > /tmp/file_issue.py << 'PYEOF'
import json, os, yaml
from collections import defaultdict

report = os.environ['RUNNER_TEMP'] + '/report.json'
run_url = os.environ['RUN_URL']
curr_data = os.environ.get('CURRENT_DATA', '')
rele_data = os.environ.get('RELEASE_DATA', '')
db_pkgs_file = os.environ.get('DB_PACKAGES', '')

# load upstream data.yml package list
upstream_pkgs = set()
upstream_pkg_map = {}
if curr_data and os.path.isfile(curr_data):
    with open(curr_data) as f:
        raw = yaml.safe_load(f)
    if isinstance(raw, dict):
        raw = raw.get('packages', [])
    for p in raw:
        pkg = p.get('package', '')
        if pkg:
            upstream_pkgs.add(pkg)
            upstream_pkg_map[pkg] = p

# load release data.yml for issue lookups on stale entries
release_pkg_map = {}
if rele_data and os.path.isfile(rele_data):
    with open(rele_data) as f:
        raw = yaml.safe_load(f)
    if isinstance(raw, dict):
        raw = raw.get('packages', [])
    for p in raw:
        pkg = p.get('package', '')
        if pkg:
            release_pkg_map[pkg] = p

def first_issue(pkg_data):
    """Extract the first issue reference from a package entry."""
    for sig in pkg_data.get('signature', []):
        for src in sig.get('sources', []):
            issue = src.get('issue', '')
            if issue:
                return issue
    return ''

# load PG-sourced packages only (filters out original soupslurpr entries)
db_pkgs = set()
if db_pkgs_file and os.path.isfile(db_pkgs_file):
    with open(db_pkgs_file) as f:
        db_pkgs = {line.strip() for line in f if line.strip()}

# packages in our database but not in the upstream dataset
removed = sorted(db_pkgs - upstream_pkgs) if upstream_pkgs else []

with open(report) as f:
    d = json.load(f)

# group by package
by_pkg = defaultdict(list)
for r in d['results']:
    by_pkg[r['package']].append(r)

# a package that matched on any source is considered a pass — its failures are noted but don't trigger
trigger_mismatches = []
trigger_errors = []
partial = []   # matched on some sources, failed on others
real_fail = [] # matched on zero sources

for pkg, rows in by_pkg.items():
    matched = [r for r in rows if r['status'] == 'match']
    failed = [r for r in rows if r['status'] != 'match']
    if matched and failed:
        partial.append((pkg, matched, failed))
    elif not matched:
        real_fail.append((pkg, failed))

trigger_stale = len(removed)

# build issue body
lines = ['Automated spot-check verification found issues in the database.']

if real_fail:
    lines += ['',
              '**Packages with no matching source:**',
              '']
    for pkg, failed in real_fail:
        for r in failed:
            if r['status'] == 'mismatch':
                rec = (r['recorded'] or '')[:23] + '...' + (r['recorded'] or '')[-5:]
                act = (r.get('actual') or 'N/A')[:23] + '...' + (r.get('actual') or 'N/A')[-5:]
                lines.append(f'- **{pkg}** ({r["source"]}): recorded {rec}, actual {act}')
                trigger_mismatches.append(r)
            elif r['status'] == 'error' and 'PAID APP' not in (r.get('error') or ''):
                lines.append(f'- **{pkg}** ({r["source"]}): {r["error"]}')
                trigger_errors.append(r)

if partial:
    lines += ['',
              '**Packages that matched on some sources (noted, not counted as failures):**',
              '']
    for pkg, matched, failed in partial:
        ok = ', '.join(r['source'] for r in matched)
        for r in failed:
            if r['status'] == 'mismatch':
                rec = (r['recorded'] or '')[:23] + '...' + (r['recorded'] or '')[-5:]
                act = (r.get('actual') or 'N/A')[:23] + '...' + (r.get('actual') or 'N/A')[-5:]
                lines.append(f'- {pkg} ({r["source"]}): recorded {rec}, actual {act} (matched via {ok})')
            elif r['status'] == 'error' and 'PAID APP' not in (r.get('error') or ''):
                lines.append(f'- {pkg} ({r["source"]}): {r["error"]} (matched via {ok})')

if removed:
    lines += ['',
              '**Packages removed from upstream database (stale entries):**',
              '']
    for pkg in removed:
        entry = upstream_pkg_map.get(pkg) or release_pkg_map.get(pkg)
        issue = f' ({first_issue(entry)})' if entry and first_issue(entry) else ''
        lines.append(f'- {pkg}{issue}')

paid_count = sum(1 for r in d['results'] if r['status'] == 'error' and 'PAID APP' in (r.get('error') or ''))
if paid_count:
    lines += ['', f'{paid_count} paid app(s) skipped (require purchase).']

if not trigger_mismatches and not trigger_errors and not trigger_stale:
    print('skip')
    exit(0)

lines += ['',
          f'Workflow run: {run_url}',
          'Download the verify-report artifact for full details.']

print(len(trigger_mismatches))
print(len(trigger_errors))
print(trigger_stale)
print('\n'.join(lines))
PYEOF

          output=$(python3 /tmp/file_issue.py)
          skip=$(echo "$output" | head -1)
          if [ "$skip" = "skip" ]; then
            echo "No mismatches, real errors, or stale entries; skipping issue."
            exit 0
          fi
          mis=$(echo "$output" | sed -n '1p')
          real=$(echo "$output" | sed -n '2p')
          stale=$(echo "$output" | sed -n '3p')
          body=$(echo "$output" | sed -n '4,$p')
          parts=()
          [ "$mis" -gt 0 ] && parts+=("${mis} mismatch(es)")
          [ "$real" -gt 0 ] && parts+=("${real} error(s)")
          [ "$stale" -gt 0 ] && parts+=("${stale} stale entry(ies)")
          IFS=', '
          title="Database spot-check: ${parts[*]}"
          unset IFS
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN — would create issue ==="
            echo "Title: $title"
            echo "Labels: database, spot-check"
            echo "Body:"
            echo "$body"
          else
            for lbl in database spot-check; do
              gh label create "$lbl" 2>/dev/null || true
            done
            gh issue create \
              --title "$title" \
              --label "database,spot-check" \
              --body "$body"
          fi
