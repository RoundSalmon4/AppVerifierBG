name: Verify Database

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Source types to check"
        required: true
        default: all
        type: choice
        options:
          - all
          - direct
          - fdroid
      percent:
        description: "Random sample percentage (0 = all packages)"
        required: false
        default: "5"
      packages:
        description: "Comma-separated package IDs (overrides percent)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Download privacyguides data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml"

      - name: Run verification
        id: verify
        env:
          MODE: ${{ inputs.mode || 'all' }}
          PERCENT: ${{ inputs.percent || '5' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          args="--data-yml $RUNNER_TEMP/data.yml --mode $MODE --output $RUNNER_TEMP/report.json"
          if [ -n "$PACKAGES" ]; then
            args="$args --packages $PACKAGES"
          elif [ "$PERCENT" != "0" ]; then
            args="$args --percent $PERCENT"
          fi
          python .github/scripts/verify_database.py $args
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-report
          path: ${{ runner.temp }}/report.json

      - name: Report summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            python3 -c "
import json
with open('$RUNNER_TEMP/report.json') as f:
    r = json.load(f)
s = r['stats']
print(f'### Database Verification Results')
print(f'')
print(f'| Result | Count |')
print(f'|---|---|')
print(f'| Matches | {s["match"]} |')
print(f'| Mismatches | {s["mismatch"]} |')
print(f'| Errors | {s["error"]} |')
print(f'')
if s['mismatch'] > 0:
    print('### Mismatches')
    print('')
    print('| Package | Source | Recorded | Actual |')
    print('|---|---|---|---|')
    for r in r['results']:
        if r['status'] == 'mismatch':
            rfp = r['recorded'][:23] + '...'
            afp = (r['actual'] or 'N/A')[:23] + '...'
            print(f'| {r[\"package\"]} | {r[\"source\"]} | {rfp} | {afp} |')
if s['error'] > 0:
    print('### Errors')
    print('')
    for r in r['results']:
        if r['status'] == 'error':
            print(f'- **{r[\"package\"]}** ({r[\"source\"]}): {r[\"error\"]}')
" >> "$GITHUB_STEP_SUMMARY"
          fi
