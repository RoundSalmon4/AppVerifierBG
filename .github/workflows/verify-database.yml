name: Verify Database

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Source types to check"
        required: true
        default: all
        type: choice
        options:
          - all
          - direct
          - fdroid
      percent:
        description: "Random sample percentage (0 = all packages)"
        required: false
        default: "5"
      packages:
        description: "Comma-separated package IDs (overrides percent)"
        required: false
        default: ""

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install build-tools (for apksigner)
        run: |
          SDK=$ANDROID_SDK_ROOT
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" 2>&1
          echo "apksigner: $(find "$SDK/build-tools" -name apksigner -print -quit 2>/dev/null || echo 'not found')"

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          # Try main tip first (freshest data). Attestations will exist once
          # upstream resumes signing submission commits.
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Run verification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'all' }}
          PERCENT: ${{ inputs.percent || '5' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          args="--data-yml $RUNNER_TEMP/data.yml --mode $MODE --output $RUNNER_TEMP/report.json"
          if [ -n "$PACKAGES" ]; then
            args="$args --packages $PACKAGES"
          elif [ "$PERCENT" != "0" ]; then
            args="$args --percent $PERCENT"
          fi
          python .github/scripts/verify_database.py $args
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-report
          path: ${{ runner.temp }}/report.json

      - name: Report summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            python .github/scripts/generate_summary.py "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
