name: Verify Database

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Source types to check"
        required: true
        default: all
        type: choice
        options:
          - all
          - direct
          - fdroid
          - gplay
      percent:
        description: "Random sample percentage (0 = all packages)"
        required: false
        default: "5"
      packages:
        description: "Comma-separated package IDs (overrides percent)"
        required: false
        default: ""
      dry_run:
        description: "Print issue body without creating it"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  attestations: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install "protobuf<4" pyyaml googleplay-python

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install build-tools (for apksigner)
        run: |
          SDK=$ANDROID_SDK_ROOT
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" 2>&1
          echo "apksigner: $(find "$SDK/build-tools" -name apksigner -print -quit 2>/dev/null || echo 'not found')"

      - name: Download and verify database
        id: verify_db
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "main" > "$RUNNER_TEMP/data_source.txt"
          else
            echo "Main not attested" >&2
            exit 1
          fi

      - name: Download release data (fallback if main attestation failed)
        if: always() && steps.verify_db.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R privacyguides/verified-apps \
            -p "data.yml" --dir "$RUNNER_TEMP" --clobber 2>/dev/null \
            || { echo "No release data available." >&2; exit 1; }
          echo "release" > "$RUNNER_TEMP/data_source.txt"

      - name: Run verification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_EMAIL: ${{ secrets.GOOGLE_PLAY_EMAIL }}
          GOOGLE_PLAY_AAS_TOKEN: ${{ secrets.GOOGLE_PLAY_AAS_TOKEN }}
          MODE: ${{ inputs.mode || 'all' }}
          PERCENT: ${{ inputs.percent || '5' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          args="--data-yml $RUNNER_TEMP/data.yml --mode $MODE --output $RUNNER_TEMP/report.json"
          if [ -n "$PACKAGES" ]; then
            args="$args --packages $PACKAGES"
          elif [ "$PERCENT" != "0" ]; then
            args="$args --percent $PERCENT"
          fi
          python .github/scripts/verify_database.py $args
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-report
          path: ${{ runner.temp }}/report.json

      - name: Report summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            python .github/scripts/generate_summary.py "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: File issue on mismatch
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/report.json" ]; then
            echo "No report found, skipping."
            exit 0
          fi
          output=$(python3 .github/scripts/file_issue.py)
          skip=$(echo "$output" | head -1)
          if [ "$skip" = "skip" ]; then
            echo "No mismatches or real errors; skipping issue."
            exit 0
          fi
          mis=$(echo "$output" | sed -n '1p')
          real=$(echo "$output" | sed -n '2p')
          body=$(echo "$output" | sed -n '3,$p')
          parts=()
          [ "$mis" -gt 0 ] && parts+=("${mis} mismatch(es)")
          [ "$real" -gt 0 ] && parts+=("${real} error(s)")
          IFS=', '
          title="Database spot-check: ${parts[*]}"
          unset IFS
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN — would create issue ==="
            echo "Title: $title"
            echo "Labels: database, spot-check"
            echo "Body:"
            echo "$body"
          else
            for lbl in database spot-check; do
              gh label create "$lbl" 2>/dev/null || true
            done
            existing=$(gh issue list --label "spot-check" --state all --json number --jq '.[].number' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              already_keys=$(echo "$existing" | while read -r num; do gh issue view "$num" --json body --jq '.body' 2>/dev/null; done | grep '^- ' | sed 's/^- *\*\*//;s/^- *//;s/[ *].*//' | sort -u)
              new_body=""
              new_count=0
              while IFS= read -r line; do
                case "$line" in
                  -*)
                    key=$(echo "$line" | sed 's/^- *\*\*//;s/^- *//;s/[ *].*//')
                    if echo "$already_keys" | grep -q -F "$key" 2>/dev/null; then
                      continue
                    fi
                    new_count=$((new_count + 1))
                    ;;
                esac
                new_body="${new_body}${line}"$'\n'
              done <<< "$body"
              if [ "$new_count" -eq 0 ]; then
                echo "All packages already reported, skipping."
                exit 0
              fi
              echo "$new_count new packages not yet reported"
              body="$new_body"
            fi
            gh issue create \
              --title "$title" \
              --label "database,spot-check" \
              --body "$body"
          fi

