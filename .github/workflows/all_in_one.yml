# ============================================================
# APPVERIFIER BG — CODEBERG SYNC ORCHESTRATOR — QUICK START
#
# Triggers:
#   - workflow_dispatch (manual, pick mode)
#   - push to feature/all-enhancements (production)
#   - workflow_run (Nightly Build completed → production)
#
# Dispatches in order:
#   codeberg.yml → codeberg_release.yml → codeberg_notes.yml
#
# ---------- GLOBAL VARIABLES (set once in GitHub) ----------
# Go to: Settings → Secrets and variables → Actions → Variables
#
# 1) NO_SIDE_EFFECTS
#    - true  = Workflows run, but SKIP pushes / releases / notes sync.
#    - false = Real syncs happen.
#
# 2) BLOCK_PUSH_TO_MASTER
#    - true  = Prevents any workflow from pushing to
#              feature/all-enhancements accidentally.
#    - false = Allows pushes to feature/all-enhancements (production).
#              Default: false.
#
# ---------- RUN MODES ----------
#
# MODE A — PLAN (dry run)
#   mode: plan
#   → No workflows dispatched. Prints what would happen only.
#   → No side effects.
#
# MODE B — PLAN_FAIL (dry run + intentional failure)
#   mode: plan_fail
#   → Same as above, but FAILS at the end on purpose.
#
# MODE C — SAFE_TEST (full run, no side effects)
#   mode: safe_test
#   NO_SIDE_EFFECTS = true   (repo variable, required)
#   → All workflows dispatched. All steps run.
#   → Side-effecting steps are SKIPPED ("[TEST]" messages).
#   → FAILS at the end intentionally. Zero risk.
#
# MODE D — PRODUCTION (real sync)
#   mode: production
#   NO_SIDE_EFFECTS = false  (repo variable, required)
#   BLOCK_PUSH_TO_MASTER = false (optional, default false)
#   → Real sync: branch pushed, releases synced, notes synced.
#   → Final result: SUCCESS.
#
# ---------- BEST PRACTICES ----------
# • For safe end‑to‑end testing, always use safe_test.
# • For checking orchestrator logic only, use plan.
# • For actual production syncs, use production.
# • Leave BLOCK_PUSH_TO_MASTER=true only if you want to
#   prevent branch pushes during testing.
#
# ============================================================
name: All-in-One Codeberg Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (see quick start guide above)"
        required: true
        default: safe_test
        type: choice
        options:
          - plan
          - plan_fail
          - safe_test
          - production
  push:
    branches:
      - feature/all-enhancements
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]

permissions:
  actions: write
  contents: write
  checks: read
  deployments: write

env:
  MODE: ${{ github.event.inputs.mode || (github.event_name == 'workflow_run' && 'production') || (github.event_name == 'push' && 'production') || '' }}
  IS_PLAN: ${{ github.event.inputs.mode == 'plan' || github.event.inputs.mode == 'plan_fail' }}
  IS_TEST: ${{ github.event.inputs.mode == 'plan_fail' || github.event.inputs.mode == 'safe_test' }}
  OWNER: RoundSalmon4
  REPO: AppVerifierBG
  REF: feature/all-enhancements

jobs:
  echo_flags:
    name: Echo flags
    runs-on: ubuntu-latest
    steps:
      - name: Echo mode flags
        run: |
          echo "MODE=${{ env.MODE }}"
          echo "IS_PLAN=${{ env.IS_PLAN }}"
          echo "IS_TEST=${{ env.IS_TEST }}"
          echo "REF=${{ env.REF }}"

  validate_files:
    name: Validate workflow files
    runs-on: ubuntu-latest
    needs: echo_flags
    steps:
      - name: Checkout repo at REF
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 1
      - name: Check required files
        shell: bash
        run: |
          set -e
          missing=0
          for f in \
            ".github/workflows/codeberg.yml" \
            ".github/workflows/codeberg_release.yml" \
            ".github/workflows/codeberg_notes.yml"
          do
            if [ -f "$f" ]; then
              echo "[OK] Found $f"
            else
              echo "[MISSING] $f"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::warning::One or more required workflow files are missing on ref '${{ env.REF }}'."
          fi

  dispatch_codeberg:
    name: Branch mirror (codeberg.yml)
    runs-on: ubuntu-latest
    needs: validate_files
    steps:
      - name: "[PLAN] Would dispatch .github/workflows/codeberg.yml"
        if: ${{ env.IS_PLAN == 'true' }}
        run: echo "[PLAN] Would dispatch .github/workflows/codeberg.yml on ref ${{ env.REF }}"
      - name: Dispatch and wait (codeberg.yml)
        if: ${{ env.IS_PLAN != 'true' }}
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: .github/workflows/codeberg.yml
        with:
          github-token: ${{ github.token }}
          script: |
            const owner=process.env.OWNER, repo=process.env.REPO, ref=process.env.REF, wf=process.env.WORKFLOW_FILE;
            const wfName=wf.split('/').pop();
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const timeout=30*60*1000, poll=10000, dl=Date.now()+timeout;
            const startAt=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref, inputs:{} });
            let runId=null;
            while(Date.now()<dl && !runId){
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{ owner, repo, workflow_id:wfName, event:'workflow_dispatch', branch:ref, per_page:50 });
              const c=runs.find(r=>new Date(r.created_at)>=new Date(startAt));
              if(c){ runId=c.id; core.info(`run=${runId}`); break; }
              await wait(poll);
            }
            if(!runId){ core.setFailed(`Timed out waiting for ${wf} run`); return; }
            while(Date.now()<dl){
              const { data: run }=await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              if(run.status==='completed'){ if(run.conclusion!=='success') core.setFailed(`${wf} concluded: ${run.conclusion}`); return; }
              if(run.status==='in_progress' || run.status==='queued' || run.status==='waiting'){ core.info(`run status: ${run.status}`); await wait(poll); continue; }
              if(run.status==='pending'){ await wait(poll); continue; }
              core.warning(`Unknown status: ${run.status}, waiting...`);
              await wait(poll);
            }
            core.setFailed(`Timed out waiting for ${wf} to complete`);

  dispatch_codeberg_release:
    name: Release sync (codeberg_release.yml)
    runs-on: ubuntu-latest
    needs: dispatch_codeberg
    if: ${{ always() && (github.event.inputs.mode == 'production' || github.event_name == 'workflow_run' || github.event_name == 'push') }}
    steps:
      - name: "[PLAN] Would dispatch .github/workflows/codeberg_release.yml"
        if: ${{ env.IS_PLAN == 'true' }}
        run: echo "[PLAN] Would dispatch .github/workflows/codeberg_release.yml on ref ${{ env.REF }}"
      - name: Dispatch and wait (codeberg_release.yml)
        if: ${{ env.IS_PLAN != 'true' }}
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: .github/workflows/codeberg_release.yml
        with:
          github-token: ${{ github.token }}
          script: |
            const owner=process.env.OWNER, repo=process.env.REPO, ref=process.env.REF, wf=process.env.WORKFLOW_FILE;
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const timeout=30*60*1000, poll=10000, dl=Date.now()+timeout;
            const startAt=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref, inputs:{} });
            let runId=null;
            while(Date.now()<dl && !runId){
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{ owner, repo, workflow_id:wf, event:'workflow_dispatch', branch:ref, per_page:50 });
              const c=runs.find(r=>new Date(r.created_at)>=new Date(startAt));
              if(c){ runId=c.id; core.info(`run=${runId}`); break; }
              await wait(poll);
            }
            if(!runId){ core.setFailed(`Timed out waiting for ${wf} run`); return; }
            while(Date.now()<dl){
              const { data: run }=await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              if(run.status==='completed'){ if(run.conclusion!=='success') core.setFailed(`${wf} concluded: ${run.conclusion}`); return; }
              if(run.status==='in_progress' || run.status==='queued' || run.status==='waiting'){ core.info(`run status: ${run.status}`); await wait(poll); continue; }
              if(run.status==='pending'){ await wait(poll); continue; }
              core.warning(`Unknown status: ${run.status}, waiting...`);
              await wait(poll);
            }
            core.setFailed(`Timed out waiting for ${wf} to complete`);

  dispatch_codeberg_notes:
    name: Notes sync (codeberg_notes.yml)
    runs-on: ubuntu-latest
    needs: dispatch_codeberg_release
    if: ${{ always() && needs.dispatch_codeberg_release.result != 'failure' }}
    steps:
      - name: "[PLAN] Would dispatch .github/workflows/codeberg_notes.yml"
        if: ${{ env.IS_PLAN == 'true' }}
        run: echo "[PLAN] Would dispatch .github/workflows/codeberg_notes.yml on ref ${{ env.REF }}"
      - name: Dispatch and wait (codeberg_notes.yml)
        if: ${{ env.IS_PLAN != 'true' }}
        uses: actions/github-script@v9
        env:
          WORKFLOW_FILE: .github/workflows/codeberg_notes.yml
        with:
          github-token: ${{ github.token }}
          script: |
            const owner=process.env.OWNER, repo=process.env.REPO, ref=process.env.REF, wf=process.env.WORKFLOW_FILE;
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const timeout=30*60*1000, poll=10000, dl=Date.now()+timeout;
            const startAt=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref, inputs:{} });
            let runId=null;
            while(Date.now()<dl && !runId){
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{ owner, repo, workflow_id:wf, event:'workflow_dispatch', branch:ref, per_page:50 });
              const c=runs.find(r=>new Date(r.created_at)>=new Date(startAt));
              if(c){ runId=c.id; core.info(`run=${runId}`); break; }
              await wait(poll);
            }
            if(!runId){ core.setFailed(`Timed out waiting for ${wf} run`); return; }
            while(Date.now()<dl){
              const { data: run }=await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              if(run.status==='completed'){ if(run.conclusion!=='success') core.setFailed(`${wf} concluded: ${run.conclusion}`); return; }
              if(run.status==='in_progress' || run.status==='queued' || run.status==='waiting'){ core.info(`run status: ${run.status}`); await wait(poll); continue; }
              if(run.status==='pending'){ await wait(poll); continue; }
              core.warning(`Unknown status: ${run.status}, waiting...`);
              await wait(poll);
            }
            core.setFailed(`Timed out waiting for ${wf} to complete`);

  fail_if_test_mode:
    name: Fail if IS_TEST
    runs-on: ubuntu-latest
    needs:
      - dispatch_codeberg
      - dispatch_codeberg_release
      - dispatch_codeberg_notes
    if: always()
    steps:
      - name: Check IS_TEST and optionally fail
        shell: bash
        run: |
          echo "IS_TEST=${{ env.IS_TEST }}"
          echo "dispatch_codeberg_release result=${{ needs.dispatch_codeberg_release.result }}"
          if [ "${{ env.IS_TEST }}" = "true" ]; then
            echo "Test mode enabled: intentionally failing."
            exit 1
          elif [ "${{ needs.dispatch_codeberg_release.result }}" = "skipped" ]; then
            echo "Release sync was skipped (production not set). Only branch mirror ran."
          else
            echo "Test mode disabled: finishing successfully."
          fi
