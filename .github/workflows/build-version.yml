name: Build Versioned Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: build
        type: choice
        options:
          - build
          - verify
          - publish
      changelog_date:
        description: 'Changelog date (YYYY-MM-DD) for release notes. Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write
  attestations: read

concurrency:
  group: verification-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          MAJOR=$(grep 'appVersionMajor' gradle/version.gradle.kts | grep -oP '\d+')
          MINOR=$(grep 'appVersionMinor' gradle/version.gradle.kts | grep -oP '\d+')
          PATCH=$(grep 'appVersionPatch' gradle/version.gradle.kts | grep -oP '\d+')
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin feature/all-enhancements

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          # Try main tip first (freshest data). Attestations will exist once
          # upstream resumes signing submission commits.
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Merge HTTPS verified domains
        run: |
          git fetch origin feature/all-enhancements --depth=1
          git show FETCH_HEAD:app/verified_domains.json > app/verified_domains.json 2>/dev/null || echo "[]" > app/verified_domains.json
          git show FETCH_HEAD:.github/scripts/merge_https_domains.py > .github/scripts/merge_https_domains.py
          git show FETCH_HEAD:.github/scripts/backfill_https_domains.py > .github/scripts/backfill_https_domains.py
          python .github/scripts/merge_https_domains.py

      - name: Commit and push sync changes
        if: github.event.inputs.mode == 'publish'
        run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add -A
          if ! git diff --quiet HEAD; then
            git commit -m "Sync privacyguides/verified-apps database"
            git push
          fi

      - name: Pull latest after sync
        if: github.event.inputs.mode == 'publish'
        run: git pull --rebase origin feature/all-enhancements

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run lint
        continue-on-error: true
        run: ./gradlew lint

      - name: Set up release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Build release APK
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.version }}

      - name: Save original APK for verify
        if: github.event.inputs.mode == 'verify'
        run: |
          mkdir -p /tmp/verify
          cp app/build/outputs/apk/release/*.apk /tmp/verify/original.apk

      - name: Rebuild APK from same source (verify)
        if: github.event.inputs.mode == 'verify'
        run: |
          rm -f app/build/outputs/apk/release/*.apk
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.version }} --rerun-tasks
          cp app/build/outputs/apk/release/*.apk /tmp/verify/rebuild.apk

      - name: Compare APKs for reproducibility
        if: github.event.inputs.mode == 'verify'
        run: |
          ORIGINAL=/tmp/verify/original.apk
          REBUILT=/tmp/verify/rebuild.apk
          RESULT=$(python3 .github/scripts/compare_apks.py "$ORIGINAL" "$REBUILT")
          echo "$RESULT"
          if echo "$RESULT" | grep -q "All non-signature files match"; then
            VERDICT="PASS"
          else
            VERDICT="FAIL"
          fi
          echo "$VERDICT" > /tmp/verify/verdict.txt
          echo "$VERSION" > /tmp/verify/version.txt
          {
            echo "## Reproducibility Verify — v${{ steps.version.outputs.version }}"
            echo ""
            echo "**Original:** $(basename "$ORIGINAL") ($(stat --format=%s "$ORIGINAL") bytes)"
            echo "**Rebuilt:**  $(basename "$REBUILT") ($(stat --format=%s "$REBUILT") bytes)"
            echo ""
            echo '```'
            echo "$RESULT"
            echo '```'
            echo ""
            echo "### Verdict: $VERDICT"
            echo ""
            echo "The verify mode produces release-quality APKs with the same params"
            echo "used by the publish mode."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verify APKs
        if: github.event.inputs.mode == 'verify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppVerifierBG-${{ steps.version.outputs.version }}-verify
          path: /tmp/verify/*.apk

      - name: Rename APK with version
        if: github.event.inputs.mode != 'verify'
        run: |
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/AppVerifierBG-${{ steps.version.outputs.version }}.apk"

      - name: Build app bundle
        if: github.event.inputs.mode != 'verify'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew bundleRelease -PversionOverride=${{ steps.version.outputs.version }}

      - name: Download bundletool
        if: github.event.inputs.mode != 'verify'
        run: |
          BUNDLETOOL_VERSION="1.18.3"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-$BUNDLETOOL_VERSION.jar"

      - name: Generate APK set from bundle
        if: github.event.inputs.mode != 'verify'
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSET_DIR="app/build/outputs/apkset/release"
          mkdir -p "$APKSET_DIR"
          APKSET="$APKSET_DIR/AppVerifierBG-${{ steps.version.outputs.version }}.apks"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$APKSET" \
            --ks="$RELEASE_KEYSTORE_PATH" \
            --ks-pass="pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias="$RELEASE_KEY_ALIAS" \
            --key-pass="pass:$RELEASE_KEY_PASSWORD"

      - name: Count privacyguides database entries
        id: pgcount
        if: github.event.inputs.mode == 'publish'
        run: |
          TOTAL=$(curl -s "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" | grep -c "\- package:" || true)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Extract fingerprint from APK
        if: github.event.inputs.mode == 'publish'
        id: apkfp
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name 'AppVerifierBG-*.apk' -print -quit 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then echo "fingerprint=unknown" >> "$GITHUB_OUTPUT"; exit 0; fi

          for dir in "$ANDROID_HOME/build-tools" "$ANDROID_SDK_ROOT/build-tools"; do
            if [ -d "$dir" ]; then
              APKSIGNER=$(find "$dir" -name apksigner -print -quit 2>/dev/null || true)
              if [ -n "$APKSIGNER" ]; then break; fi
            fi
          done
          if [ -z "$APKSIGNER" ]; then APKSIGNER=$(command -v apksigner 2>/dev/null || true); fi

          if [ -n "$APKSIGNER" ]; then
            FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK_FILE" 2>/dev/null | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi
          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT=$(keytool -printcert -jarfile "$APK_FILE" 2>&1 | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi
          if [ -z "$FINGERPRINT" ] && [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then
            FINGERPRINT=$(keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1 | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi
          echo "fingerprint=${FINGERPRINT:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Build release body
        if: github.event.inputs.mode == 'publish'
        id: body
        env:
          CHANGELOG_DATE: ${{ github.event.inputs.changelog_date }}
        run: |
          DATE="${CHANGELOG_DATE:-$(date -u +'%Y-%m-%d')}"
          cat > /tmp/release_body.md << BODYEOF
          **Version:** v${{ steps.version.outputs.version }}

          **Branch:** \`feature/all-enhancements\`

          **Privacy Guides database entries:** ${{ steps.pgcount.outputs.total }}

          **Certificate fingerprint (SHA-256):** \`${{ steps.apkfp.outputs.fingerprint }}\`

          ---

          This build is signed with the release key. Compare the SHA-256 fingerprint against the output of \`apksigner verify --print-certs AppVerifierBG-${{ steps.version.outputs.version }}.apk\` to confirm the APK hasn't been tampered with.

          This build includes data from the [Privacy Guides Verified Apps](https://github.com/privacyguides/verified-apps) database (CC BY 4.0). See each entry's issue link in the data file for details on how it was verified.

          New apps can be submitted at [privacyguides/verified-apps/issues](https://github.com/privacyguides/verified-apps/issues/new?template=app-submission.yml).

          BODYEOF

          if grep -q "^## $DATE$" CHANGELOG.md; then
            echo "" >> /tmp/release_body.md
            echo "## What's Changed" >> /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            awk "/^## $DATE"'$/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md >> /tmp/release_body.md
          fi

          echo "path=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppVerifierBG-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/release/AppVerifierBG-${{ steps.version.outputs.version }}.apk
            app/build/outputs/apkset/release/AppVerifierBG-${{ steps.version.outputs.version }}.apks

      - name: Create git tag
        if: github.event.inputs.mode == 'publish'
        run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          VERSION_TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists"
            exit 1
          fi
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Create Release
        if: github.event.inputs.mode == 'publish'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ steps.body.outputs.path }}
          files: |
            app/build/outputs/apk/release/AppVerifierBG-${{ steps.version.outputs.version }}.apk
            app/build/outputs/apkset/release/AppVerifierBG-${{ steps.version.outputs.version }}.apks
          make_latest: true
