name: Build APK (debug / unsigned / signed)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - unsigned
          - signed
      branch:
        description: 'Branch to build'
        required: true
        default: feature/all-enhancements
        type: choice
        options:
          - feature/all-enhancements

permissions:
  contents: write
  actions: write
  attestations: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          MAJOR=$(grep 'appVersionMajor' gradle/version.gradle.kts | grep -oP '\d+')
          MINOR=$(grep 'appVersionMinor' gradle/version.gradle.kts | grep -oP '\d+')
          PATCH=$(grep 'appVersionPatch' gradle/version.gradle.kts | grep -oP '\d+')
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin ${{ github.event.inputs.branch }}

      - name: Download verified-apps database
        run: curl -fsSL -o "$RUNNER_TEMP/data.yml" "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml"

      - name: Verify database attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$RUNNER_TEMP/data.yml" 2>/dev/null; then
              exit 0
            fi
            echo "Attestation not yet available, retrying in 10s (attempt $i/5)..."
            sleep 10
          done
          gh attestation verify -R privacyguides/verified-apps \
            --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
            "$RUNNER_TEMP/data.yml"

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6
        with:
          validate-wrappers: true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android 2>&1

      - name: Set up release keystore
        if: github.event.inputs.mode == 'signed'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$HOME/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        if: github.event.inputs.mode == 'debug'
        run: ./gradlew assembleDebug

      - name: Build unsigned release APK
        if: github.event.inputs.mode == 'unsigned'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.version }}

      - name: Build signed release APK
        if: github.event.inputs.mode == 'signed'
        run: ./gradlew assembleRelease

      - name: Prepare debug APK
        if: github.event.inputs.mode == 'debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in app/build/outputs/apk/debug/"
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" /tmp/app.apk
        shell: bash

      - name: Prepare unsigned APK
        if: github.event.inputs.mode == 'unsigned'
        run: |
          mv app/build/outputs/apk/release/*.apk /tmp/app.apk

      - name: Prepare signed release APK
        if: github.event.inputs.mode == 'signed'
        run: |
          mv app/build/outputs/apk/release/*.apk /tmp/app.apk

      - name: Sanitize branch name for artifact
        id: sanitize
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SANITIZED="${BRANCH//\//-}"
          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set artifact name
        id: artifact
        run: |
          if [ "${{ github.event.inputs.mode }}" = "unsigned" ]; then
            echo "name=AppVerifierBG-${{ steps.version.outputs.version }}-unsigned" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" = "signed" ]; then
            echo "name=AppVerifierBG-${{ steps.version.outputs.version }}-signed-${{ steps.sanitize.outputs.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=app-debug-${{ steps.sanitize.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: /tmp/app.apk
