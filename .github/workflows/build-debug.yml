name: Build APK (debug / unsigned / signed)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - unsigned
          - signed
      branch:
        description: 'Branch to build'
        required: true
        default: feature/all-enhancements
        type: choice
        options:
          - feature/all-enhancements

permissions:
  contents: write
  actions: write
  attestations: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          MAJOR=$(grep 'appVersionMajor' gradle/version.gradle.kts | grep -oP '\d+')
          MINOR=$(grep 'appVersionMinor' gradle/version.gradle.kts | grep -oP '\d+')
          PATCH=$(grep 'appVersionPatch' gradle/version.gradle.kts | grep -oP '\d+')
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin ${{ github.event.inputs.branch }}

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          # Try main tip first (freshest data). Attestations will exist once
          # upstream resumes signing submission commits.
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Merge HTTPS verified domains
        run: |
          git fetch origin feature/all-enhancements --depth=1
          git show FETCH_HEAD:app/verified_domains.json > app/verified_domains.json 2>/dev/null || echo "[]" > app/verified_domains.json
          git show FETCH_HEAD:.github/scripts/merge_https_domains.py > .github/scripts/merge_https_domains.py
          git show FETCH_HEAD:.github/scripts/backfill_https_domains.py > .github/scripts/backfill_https_domains.py
          python .github/scripts/merge_https_domains.py

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android 2>&1

      - name: Set up release keystore
        if: github.event.inputs.mode == 'signed'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$HOME/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$HOME/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        continue-on-error: true
        run: ./gradlew lint

      - name: Build debug APK
        if: github.event.inputs.mode == 'debug'
        run: ./gradlew assembleDebug

      - name: Build unsigned release APK
        if: github.event.inputs.mode == 'unsigned'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.version }}

      - name: Build signed release APK
        if: github.event.inputs.mode == 'signed'
        run: ./gradlew assembleRelease

      - name: Prepare debug APK
        if: github.event.inputs.mode == 'debug'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in app/build/outputs/apk/debug/"
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" /tmp/app.apk
        shell: bash

      - name: Prepare unsigned APK
        if: github.event.inputs.mode == 'unsigned'
        run: |
          mv app/build/outputs/apk/release/*.apk /tmp/app.apk

      - name: Prepare signed release APK
        if: github.event.inputs.mode == 'signed'
        run: |
          mv app/build/outputs/apk/release/*.apk /tmp/app.apk

      - name: Sanitize branch name for artifact
        id: sanitize
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SANITIZED="${BRANCH//\//-}"
          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set artifact name
        id: artifact
        run: |
          if [ "${{ github.event.inputs.mode }}" = "unsigned" ]; then
            echo "name=AppVerifierBG-${{ steps.version.outputs.version }}-unsigned" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" = "signed" ]; then
            echo "name=AppVerifierBG-${{ steps.version.outputs.version }}-signed-${{ steps.sanitize.outputs.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=app-debug-${{ steps.sanitize.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: /tmp/app.apk
