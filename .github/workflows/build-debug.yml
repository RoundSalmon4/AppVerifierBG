name: Build APK
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: feature/all-enhancements
        type: choice
        options:
          - feature/all-enhancements
          - ui/dev-slim
      mode:
        description: 'Build mode'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - build

permissions:
  contents: write
  actions: write
  attestations: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin ${{ github.event.inputs.branch }}

      - name: Download verified-apps database
        run: curl -fsSL -o "$RUNNER_TEMP/data.yml" "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml"

      - name: Verify database attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$RUNNER_TEMP/data.yml" 2>/dev/null; then
              exit 0
            fi
            echo "Attestation not yet available, retrying in 10s (attempt $i/5)..."
            sleep 10
          done
          gh attestation verify -R privacyguides/verified-apps \
            --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
            "$RUNNER_TEMP/data.yml"

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up debug keystore
        if: github.event.inputs.mode == 'debug'
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android 2>&1

      - name: Set up release keystore
        if: github.event.inputs.mode == 'build'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Determine build flavor
        id: flavor
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "build" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
            echo "suffix=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
            echo "suffix=debug" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build APK
        run: ./gradlew ${{ steps.flavor.outputs.task }}

      - name: Upload APK
        run: |
          APK_FILE=$(find "app/build/outputs/apk/${{ steps.flavor.outputs.dir }}" -name '*.apk' -print -quit 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in app/build/outputs/apk/${{ steps.flavor.outputs.dir }}/"
            ls -la "app/build/outputs/apk/${{ steps.flavor.outputs.dir }}/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "/tmp/app-${{ steps.flavor.outputs.suffix }}.apk"
        shell: bash

      - name: Sanitize branch name for artifact
        id: sanitize
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SANITIZED="${BRANCH//\//-}"
          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.flavor.outputs.suffix }}-${{ steps.sanitize.outputs.name }}
          path: /tmp/app-${{ steps.flavor.outputs.suffix }}.apk
