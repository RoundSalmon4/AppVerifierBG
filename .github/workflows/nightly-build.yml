name: Nightly Build
on:
  workflow_dispatch:
  repository_dispatch:
    types: [nightly]

permissions:
  contents: write
  attestations: read

concurrency:
  group: verification-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    steps:
      - name: Check for existing release today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          TAG="nightly-$TODAY"

          # skip if today's nightly already exists
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Nightly release already exists for today: $TAG"
            exit 1
          fi

          # skip if a versioned release was published today (same UTC date)
          if gh release list --repo ${{ github.repository }} --limit 50 \
            --json tagName,publishedAt | python3 -c \
            "import json,sys; r=json.load(sys.stdin); today='$TODAY'; [sys.exit(0) for x in r if x['tagName'].startswith('v') and x['publishedAt'].startswith(today)]; sys.exit(1)"; then
            echo "Versioned release published today, skipping nightly"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/all-enhancements
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          # Try main tip first (freshest data). Attestations will exist once
          # upstream resumes signing submission commits.
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Run sync script
        run: python .github/scripts/generate_internal_db.py --data-yml "$RUNNER_TEMP/data.yml"

      - name: Merge HTTPS verified domains
        run: |
          git fetch origin feature/all-enhancements --depth=1
          git show FETCH_HEAD:app/verified_domains.json > app/verified_domains.json 2>/dev/null || echo "[]" > app/verified_domains.json
          git show FETCH_HEAD:.github/scripts/merge_https_domains.py > .github/scripts/merge_https_domains.py
          git show FETCH_HEAD:.github/scripts/backfill_https_domains.py > .github/scripts/backfill_https_domains.py
          python .github/scripts/merge_https_domains.py

      - name: Commit and push sync changes
        run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add -A
          if ! git diff --quiet HEAD; then
            git commit -m "Sync privacyguides/verified-apps database"
            git push
          fi

      - name: Pull latest after sync
        run: git pull --rebase origin feature/all-enhancements

      - name: Scrape GrapheneOS forum for community hashes
        continue-on-error: true
        run: python .github/scripts/scrape_forum_db.py --txt-only grapheneos-forum-hashes

      - name: Get branch name
        id: branch
        run: echo "name=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Count privacyguides database entries
        id: pgcount
        run: |
          TOTAL=$(curl -s "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" | grep -c "\- package:" || true)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run lint
        continue-on-error: true
        run: ./gradlew lint

      - name: Set up release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1

      - name: Get date for release
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew assembleRelease -PversionSuffix=-nightly-${{ steps.date.outputs.date }}

      - name: Rename APK with date
        run: |
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/AppVerifierBG-nightly-${{ steps.date.outputs.date }}.apk"

      - name: Build app bundle
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
          ./gradlew bundleRelease -PversionSuffix=-nightly-${{ steps.date.outputs.date }}

      - name: Download bundletool
        run: |
          BUNDLETOOL_VERSION="1.18.3"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"

      - name: Generate APK set from bundle
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSET_DIR="app/build/outputs/apkset/release"
          mkdir -p "$APKSET_DIR"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output="$APKSET_DIR/AppVerifierBG-nightly-${{ steps.date.outputs.date }}.zip" \
            --ks="$RELEASE_KEYSTORE_PATH" \
            --ks-pass="pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias="$RELEASE_KEY_ALIAS" \
            --key-pass="pass:$RELEASE_KEY_PASSWORD"

      - name: Rename community hashes file
        if: hashFiles('grapheneos-forum-hashes.txt') != ''
        run: mv grapheneos-forum-hashes.txt grapheneos-forum-hashes-${{ steps.date.outputs.date }}.txt

      - name: Extract fingerprint from APK
        id: apkfp
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name 'AppVerifierBG-nightly-*.apk' -print -quit 2>/dev/null || true)
          if [ -z "$APK_FILE" ]; then
            echo "fingerprint=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for dir in "$ANDROID_HOME/build-tools" "$ANDROID_SDK_ROOT/build-tools"; do
            if [ -d "$dir" ]; then
              APKSIGNER=$(find "$dir" -name apksigner -print -quit 2>/dev/null || true)
              if [ -n "$APKSIGNER" ]; then break; fi
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner 2>/dev/null || true)
          fi

          if [ -n "$APKSIGNER" ]; then
            FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK_FILE" 2>/dev/null | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi

          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT=$(keytool -printcert -jarfile "$APK_FILE" 2>&1 | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi

          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT=$(unzip -p "$APK_FILE" 'META-INF/CERT.RSA' 2>/dev/null | keytool -printcert -file - 2>&1 | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi

          if [ -z "$FINGERPRINT" ] && [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then
            FINGERPRINT=$(keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" 2>&1 | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 || true)
          fi

          if [ -z "$FINGERPRINT" ]; then
            echo "fingerprint=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body
        id: body
        run: |
          cat > /tmp/release_body.md << BODYEOF
          **This build is considered beta software.** While I believe it is stable and fully functional, you may encounter issues. Please report any problems via the issue tracker.

          **Branch:** \`${{ steps.branch.outputs.name }}\`

          **Privacy Guides database entries:** ${{ steps.pgcount.outputs.total }}

          **Certificate fingerprint (SHA-256):** \`${{ steps.apkfp.outputs.fingerprint }}\`

          ---

          This build includes data from the [Privacy Guides Verified Apps](https://github.com/privacyguides/verified-apps) database (CC BY 4.0). See each entry's issue link in the data file for details on how it was verified.

          New apps can be submitted at [privacyguides/verified-apps/issues](https://github.com/privacyguides/verified-apps/issues/new?template=app-submission.yml).

          **Community hashes:** \`grapheneos-forum-hashes-${{ steps.date.outputs.date }}.txt\` is included in the release assets — hashes shared by users on the [GrapheneOS forum](https://discuss.grapheneos.org/d/15368-lets-compare-hashes-for-apps-not-in-appverifiers-database), in text format for import into the user database. These are community-submitted with no guarantee of accuracy. Cross-verify against multiple sources before trusting.
          BODYEOF

          DATE="${{ steps.date.outputs.date }}"
          if grep -q "^## $DATE$" CHANGELOG.md; then
            echo "" >> /tmp/release_body.md
            echo "## What's Changed" >> /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            awk "/^## $DATE"'$/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md >> /tmp/release_body.md
          fi

          echo "path=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly ${{ steps.date.outputs.date }}
          body_path: ${{ steps.body.outputs.path }}
          files: |
            app/build/outputs/apk/release/AppVerifierBG-nightly-${{ steps.date.outputs.date }}.apk
            app/build/outputs/apkset/release/AppVerifierBG-nightly-${{ steps.date.outputs.date }}.zip
            grapheneos-forum-hashes-${{ steps.date.outputs.date }}.txt
          make_latest: false
