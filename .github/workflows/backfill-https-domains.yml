name: Backfill HTTPS Verified Domains
on:
  workflow_dispatch:

permissions:
  contents: write
  attestations: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/all-enhancements
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin feature/all-enhancements

      - name: Download and verify database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_main() {
            local file=$1
            gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$file"
          }
          verify_release() {
            local file=$1
            local tag
            tag=$(gh release view -R privacyguides/verified-apps --json tagName -q .tagName)
            gh release verify-asset -R privacyguides/verified-apps "$tag" "$file"
          }
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if verify_main "$RUNNER_TEMP/data.yml"; then
            echo "Attestation verified (main)"
          else
            echo "main not attested, using latest release data..."
            gh release download -R privacyguides/verified-apps \
              -p "data.yml" --dir "$RUNNER_TEMP" --clobber
            if verify_release "$RUNNER_TEMP/data.yml"; then
              echo "Attestation verified (release)"
            else
              echo "ERROR: Release data also not attested" >&2
              exit 1
            fi
          fi

      - name: Sync internal database from upstream
        run: |
          python .github/scripts/generate_internal_db.py \
            --data-yml "$RUNNER_TEMP/data.yml"

      - name: Backfill HTTPS Verified Domain sources
        id: backfill
        run: |
          python .github/scripts/backfill_https_domains.py \
            --data-yml "$RUNNER_TEMP/data.yml" 2>&1 | tee "$RUNNER_TEMP/backfill_output.txt"

      - name: Report results
        if: steps.backfill.outcome == 'success'
        run: |
          TOTAL=$(grep -oP 'Derived unique domains:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          SERVING=$(grep -oP 'Domains serving assetlinks:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          MATCHES=$(grep -oP 'Matching apps found:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          SKIPPED=$(grep -oP 'Already had VERIFIED_DOMAIN_HTTPS:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          ADDED=$(grep -oP 'New sources added:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          {
            echo "## Backfill HTTPS Verified Domains"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total domains checked | $TOTAL |"
            echo "| Domains serving assetlinks | $SERVING |"
            echo "| Matching apps found | $MATCHES |"
            echo "| Already had VERIFIED_DOMAIN_HTTPS | $SKIPPED |"
            echo "| New sources added | $ADDED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated database and verified domains
        run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync upstream database and backfill HTTPS Verified Domain sources"
            git remote set-url origin https://RoundSalmon4:${{ secrets.PAT }}@github.com/RoundSalmon4/AppVerifierBG.git
            git push origin feature/all-enhancements
            git remote set-url origin https://github.com/RoundSalmon4/AppVerifierBG.git
          fi
