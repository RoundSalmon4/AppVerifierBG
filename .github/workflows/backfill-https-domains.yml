name: Backfill HTTPS Verified Domains
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to backfill'
        required: true
        default: feature/all-enhancements
        type: choice
        options:
          - feature/all-enhancements
          - dev/test

permissions:
  contents: write
  attestations: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Pull latest
        run: git pull --rebase origin ${{ github.event.inputs.branch }}

      - name: Download verified-apps database
        run: curl -fsSL -o "$RUNNER_TEMP/data.yml" "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml"

      - name: Verify database attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh attestation verify -R privacyguides/verified-apps \
              --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
              "$RUNNER_TEMP/data.yml" 2>/dev/null; then
              exit 0
            fi
            echo "Attestation not yet available, retrying in 10s (attempt $i/5)..."
            sleep 10
          done
          gh attestation verify -R privacyguides/verified-apps \
            --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
            "$RUNNER_TEMP/data.yml"

      - name: Sync internal database from upstream
        run: |
          python .github/scripts/generate_internal_db.py \
            --data-yml "$RUNNER_TEMP/data.yml"

      - name: Backfill HTTPS Verified Domain sources
        id: backfill
        run: |
          python .github/scripts/backfill_https_domains.py \
            --data-yml "$RUNNER_TEMP/data.yml" 2>&1 | tee "$RUNNER_TEMP/backfill_output.txt"

      - name: Report results
        if: steps.backfill.outcome == 'success'
        run: |
          SERVING=$(grep -oP 'Domains serving assetlinks:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          MATCHES=$(grep -oP 'Matching apps found:\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          MODIFIED=$(grep -oP 'Modified\s+\K\d+' "$RUNNER_TEMP/backfill_output.txt" || echo 0)
          {
            echo "## Backfill HTTPS Verified Domains"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
          echo "| Domains serving assetlinks | $SERVING |"
          echo "| Matching (pkg in assetlinks) | $MATCHES |"
            echo "| Entries modified in database | $MODIFIED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated database
        run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync upstream database and backfill HTTPS Verified Domain sources"
            git remote set-url origin https://RoundSalmon4:${{ secrets.PAT }}@github.com/RoundSalmon4/AppVerifierBG.git
            git push origin ${{ github.event.inputs.branch }}
            git remote set-url origin https://github.com/RoundSalmon4/AppVerifierBG.git
          fi
