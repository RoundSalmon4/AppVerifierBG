name: Experiment - Assetlinks Coverage

on:
  workflow_dispatch:

jobs:
  check-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/domtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run coverage check
        run: python experiment/check_assetlinks_coverage.py 2>&1 | tee coverage_output.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks-coverage-report
          path: |
            experiment/coverage_report.json
            coverage_output.txt
