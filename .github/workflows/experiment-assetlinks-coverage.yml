name: Experiment - Assetlinks Coverage

on:
  workflow_dispatch:

jobs:
  check-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev/domtest

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run coverage check
        run: python experiment/check_assetlinks_coverage.py 2>&1 | tee coverage_output.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assetlinks-coverage-report
          path: |
            experiment/coverage_report.json
            coverage_output.txt
