name: Stale Entry Detection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print issue body without creating it"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  attestations: read
  issues: write

jobs:
  stale-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download upstream data
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/data.yml" \
            "https://raw.githubusercontent.com/privacyguides/verified-apps/main/data.yml" \
            || { echo "Failed to download from main" >&2; exit 1; }
          if gh attestation verify -R privacyguides/verified-apps \
            --cert-identity-regex 'https://github.com/privacyguides/.github/.github/workflows/sign-artifact.yml*' \
            "$RUNNER_TEMP/data.yml"; then
            echo "main" > "$RUNNER_TEMP/data_source.txt"
          else
            echo "Main not attested" >&2
            exit 1
          fi

      - name: Download release data (fallback)
        if: always() && steps.download.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R privacyguides/verified-apps \
            -p "data.yml" --dir "$RUNNER_TEMP" --clobber 2>/dev/null \
            || { echo "No release data available." >&2; exit 1; }
          echo "release" > "$RUNNER_TEMP/data_source.txt"

      - name: Detect possible stale entries
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DATA: ${{ runner.temp }}/data.yml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/data.yml" ]; then
            echo "No upstream data available, skipping."
            exit 0
          fi
          output=$(python3 .github/scripts/detect_stale_entries.py)
          first=$(echo "$output" | head -1)
          if [ "$first" = "skip" ]; then
            echo "No possible stale entries detected, skipping."
            exit 0
          fi
          stale="$first"
          body=$(echo "$output" | tail -n +2)
          title="Database spot-check: ${stale} possible stale entries"
          echo "Title: $title"
          echo "Labels: database, stale-entries"
          echo "Body:"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN — issue not created ==="
            exit 0
          fi
          for lbl in database stale-entries; do
            gh label create "$lbl" 2>/dev/null || true
          done
          existing=$(gh issue list --label "stale-entries" --state open --json number --jq '.[].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            already=$(gh issue view "$existing" --json body --jq '.body' 2>/dev/null | grep '^- ' | sed 's/^- \([^ ]*\).*/\1/')
            new_body=""
            new_count=0
            while IFS= read -r line; do
              pkg=$(echo "$line" | sed 's/^- \([^ ]*\).*/\1/')
              case "$line" in
                -*)
                  if echo "$already" | grep -q -F "$pkg" 2>/dev/null; then
                    continue
                  fi
                  new_count=$((new_count + 1))
                  ;;
              esac
              new_body="${new_body}${line}"$'\n'
            done <<< "$body"
            if [ "$new_count" -eq 0 ]; then
              echo "All packages already reported in #$existing, skipping."
              exit 0
            fi
            echo "$new_count new packages not in #$existing"
            body="$new_body"
            stale="$new_count"
            title="Database spot-check: ${stale} possible stale entries"
          fi
          gh issue create \
            --title "$title" \
            --label "database,stale-entries" \
            --body "$body"

